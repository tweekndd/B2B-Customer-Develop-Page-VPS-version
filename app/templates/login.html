{# 登录页面 - 独立全屏布局（V7 品牌化） #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Trade Customer Analyzer</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink-950: #05080f;
            --ink-900: #0a0f1c;
            --ink-800: #101728;
            --ink-700: #1c2740;
            --ink-600: #334663;
            --ink-400: #5e6c88;
            --ink-300: #94a3bd;
            --blue-400: #60a5fa;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background:
                radial-gradient(900px 520px at 22% 18%, rgba(37, 99, 235, 0.22) 0%, transparent 62%),
                radial-gradient(760px 480px at 82% 84%, rgba(14, 165, 233, 0.14) 0%, transparent 60%),
                linear-gradient(180deg, var(--ink-950) 0%, var(--ink-900) 60%, #081020 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e7ecf6;
        }

        .login-container {
            width: 100%;
            max-width: 410px;
            animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: linear-gradient(165deg, rgba(28, 39, 64, 0.55), rgba(16, 23, 40, 0.85));
            border: 1px solid rgba(96, 165, 250, 0.14);
            border-radius: 20px;
            padding: 38px 34px 30px;
            box-shadow: 0 30px 70px -18px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-brand-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 20px;
            background: linear-gradient(160deg, rgba(37, 99, 235, 0.16), rgba(37, 99, 235, 0.04));
            box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.2), 0 14px 30px -10px rgba(37, 99, 235, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-brand-icon img {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }
        .login-brand h1 {
            font-family: 'Outfit', 'Inter', sans-serif;
            color: #fff;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
        }
        .login-brand p {
            color: var(--ink-300);
            font-size: 13px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: var(--ink-300);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(5, 8, 15, 0.6);
            border: 1px solid var(--ink-700);
            border-radius: 11px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--blue-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
        }
        .form-input::placeholder { color: var(--ink-400); }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--blue-500), var(--blue-700));
            border: none;
            border-radius: 11px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s;
            box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.5);
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px -6px rgba(37, 99, 235, 0.6);
        }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .error-message.show { display: block; }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            color: var(--ink-400);
            font-size: 12.5px;
        }

        .password-toggle { position: relative; }
        .password-toggle .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--ink-400);
            cursor: pointer;
            padding: 4px;
        }
        .password-toggle .toggle-btn:hover { color: var(--ink-300); }

        .spinner-mini {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-icon">
                    <img src="/static/img/logo.png" alt="AI Trade Analyzer">
                </div>
                <h1>AI Trade Analyzer</h1>
                <p>AI 客户开发与邮件外联系统</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-input" placeholder="输入用户名" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-toggle">
                        <input type="password" id="password" class="form-input" placeholder="输入密码" autocomplete="current-password" required>
                        <button type="button" class="toggle-btn" onclick="togglePassword()" tabindex="-1">
                            <i class="bi bi-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="loginBtnText">登 录</span>
                </button>
            </form>

            <div class="login-footer">
                <i class="bi bi-shield-lock me-1"></i> 仅授权用户可访问
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');

            if (!username || !password) {
                showError('请输入用户名和密码');
                return false;
            }

            // 禁用按钮
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner-mini"></span> 登录中...';
            errorEl.classList.remove('show');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();

                if (res.ok) {
                    // 跳转回之前页面或首页
                    const params = new URLSearchParams(window.location.search);
                    let next = params.get('next') || '/';
                    // 安全校验：只允许相对路径，防止开放重定向
                    if (!next.startsWith('/') || next.startsWith('//')) {
                        next = '/';
                    }
                    window.location.href = next;
                } else {
                    showError(data.detail || '登录失败');
                }
            } catch (err) {
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                btnText.textContent = '登 录';
            }

            return false;
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.classList.add('show');
        }
    </script>
</body>
</html>
