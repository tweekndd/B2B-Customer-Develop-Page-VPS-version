# =============================================================================
# B2B Customer Develop Platform — Nginx 反向代理配置
# Internet → Nginx(80/443) → FastAPI(127.0.0.1:8000)
#
# FastAPI 应用只监听 127.0.0.1:8000（docker-compose 中绑定回环地址），
# 公网无法直接访问后台，所有请求必须经过本 Nginx。
# =============================================================================

# 隐藏 Nginx 版本号
server_tokens off;

# ── 限流区：登录接口防暴力破解 ──
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

# 上游：FastAPI 应用（docker-compose 服务名 app，容器内监听 8000）
upstream b2b_app {
    server app:8000;
    keepalive 32;
}

# ── HTTP（80）：重定向到 HTTPS ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 上传文件大小上限（Excel 导入等）
    client_max_body_size 50m;

    # 有证书时强制 HTTPS 跳转（无证书时 entrypoint 生成自签名证书，此处也可放行）
    location / {
        proxy_pass http://b2b_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 事件流：禁止缓冲，实时推送客户发现进度
    location /api/discovery/task-stream {
        proxy_pass http://b2b_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# ── HTTPS（443）：生产环境主入口 ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # 证书：放置于 ./certs/fullchain.pem 与 ./certs/privkey.pem
    # 未提供时由 entrypoint 自动生成自签名证书，生产请替换为 Let's Encrypt / 商业证书
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 登录接口限流
    location /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://b2b_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://b2b_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 事件流：禁止缓冲，实时推送客户发现进度
    location /api/discovery/task-stream {
        proxy_pass http://b2b_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
